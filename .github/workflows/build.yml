name: Build GlassBar
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish GlassBar/GlassBar.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GlassBar-win-x64
          path: publish/GlassBar.exe
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GlassBar v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: publish/GlassBar.exe
          generate_release_notes: true
