name: Build GlassBar
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish GlassBar/GlassBar.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GlassBar-win-x64
          path: publish/GlassBar.exe
      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/GlassBar.exe
          generate_release_notes: true
