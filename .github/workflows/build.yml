name: Build
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Glass Taskbar Studio
        run: dotnet publish GlassTaskbarStudio/GlassTaskbarStudio.csproj -c Release -o publish/studio
      - name: Publish GlassBar (dock replacement)
        run: dotnet publish GlassBar/GlassBar.csproj -c Release -o publish/dock
      - uses: actions/upload-artifact@v4
        with:
          name: GlassTaskbarStudio-win-x64
          path: publish/studio/GlassTaskbarStudio.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Glass Taskbar Studio v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            publish/studio/GlassTaskbarStudio.exe
            publish/dock/GlassBar.exe
          generate_release_notes: true
